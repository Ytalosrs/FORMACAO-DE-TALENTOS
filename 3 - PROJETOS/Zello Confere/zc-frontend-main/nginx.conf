server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Resolver interno do Docker; a variável evita que o Nginx falhe ao subir
    # se o backend ainda não estiver disponível.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API: encaminha /api e /health para o zc-backend
    location /api/ {
        set $backend http://zc-backend:3000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
    }

    location = /api {
        set $backend http://zc-backend:3000;
        proxy_pass $backend;
    }

    location = /health {
        set $backend http://zc-backend:3000;
        proxy_pass $backend;
    }

    # Assets com hash no nome: cache longo
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: qualquer rota do React cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
